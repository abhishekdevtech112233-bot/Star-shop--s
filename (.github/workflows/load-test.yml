name: Star Shops 30-Min Load Test

on:
  workflow_dispatch:

jobs:
  k6_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup k6 binary
        uses: grafana/setup-k6-action@v1

      - name: Run k6 load test
        run: k6 run load-test.js
