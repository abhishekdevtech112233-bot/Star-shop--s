<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FFFFFF">
  <title>Star Shops - Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #FFFFFF;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      text-align: center;
    }

    .star-offline-wrapper {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .star-offline-logo {
      width: 82px;
      height: 82px;
      margin-bottom: 18px;
    }

    .three-wave-dots {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 18px;
    }

    .three-wave-dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #111827;
      animation: starDotWave 1.1s infinite ease-in-out;
    }

    .three-wave-dots span:nth-child(2) {
      animation-delay: 0.16s;
    }

    .three-wave-dots span:nth-child(3) {
      animation-delay: 0.32s;
    }

    @keyframes starDotWave {
      0%, 80%, 100% {
        transform: scale(0.55);
        opacity: 0.35;
      }
      40% {
        transform: scale(1.12);
        opacity: 1;
      }
    }

    .star-offline-text {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.55;
      color: #111827;
      margin-bottom: 22px;
    }

    .star-offline-retry {
      background: #111827;
      color: #FFFFFF;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .star-offline-retry:active {
      transform: scale(0.97);
    }

    .star-offline-retry:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .star-offline-status {
      margin-top: 12px;
      font-size: 12px;
      font-weight: 700;
      color: #6B7280;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <main class="star-offline-wrapper" role="status" aria-live="polite">
    <div class="star-offline-logo" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
        <defs>
          <linearGradient id="sbgRoofRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF3B30"/>
            <stop offset="100%" stop-color="#C70000"/>
          </linearGradient>
          <linearGradient id="sbgStoreYellow" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFD700"/>
            <stop offset="100%" stop-color="#FFA500"/>
          </linearGradient>
          <linearGradient id="sbgGlassBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00F2FE"/>
            <stop offset="100%" stop-color="#4FACFE"/>
          </linearGradient>
          <linearGradient id="sbgBgBlack" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#141414"/>
            <stop offset="100%" stop-color="#000000"/>
          </linearGradient>
          <filter id="sbgPopShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
          </filter>
        </defs>

        <rect width="512" height="512" rx="116" fill="url(#sbgBgBlack)" stroke="#FFD700" stroke-width="8"/>

        <g filter="url(#sbgPopShadow)">
          <rect x="100" y="380" width="312" height="24" rx="6" fill="#E0E0E0"/>
          <path d="M 120 220 L 120 380 L 392 380 L 392 220 Z" fill="url(#sbgStoreYellow)"/>

          <rect x="150" y="250" width="90" height="90" rx="10" fill="url(#sbgGlassBlue)" stroke="#111111" stroke-width="6"/>
          <path d="M 175 250 L 150 280" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
          <path d="M 215 250 L 150 325" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

          <rect x="272" y="230" width="90" height="150" rx="8" fill="url(#sbgGlassBlue)" stroke="#111111" stroke-width="6"/>
          <circle cx="292" cy="305" r="8" fill="#111111"/>

          <path d="M 80 140 Q 256 100 432 140 L 412 220 L 100 220 Z" fill="url(#sbgRoofRed)" stroke="#111111" stroke-width="6"/>
          <path d="M 160 123 L 150 220" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
          <path d="M 256 112 L 256 220" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
          <path d="M 352 123 L 362 220" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
        </g>
      </svg>
    </div>

    <div class="three-wave-dots" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>

    <div class="star-offline-text" id="starOfflineMsg">
      कृपया आगे बढ़ने के लिए अपना इंटरनेट चालू करें।
    </div>

    <button type="button" class="star-offline-retry" id="starOfflineBtn" onclick="handleStarRetry()">
      दोबारा कोशिश करें
    </button>
    <div class="star-offline-status" id="starOfflineStatus" aria-live="polite"></div>
  </main>

  <script>
    function isHindiLang() {
      const savedLang =
        localStorage.getItem("starshops_lang") ||
        localStorage.getItem("app_lang") ||
        navigator.language ||
        "hi";
      return String(savedLang).toLowerCase().startsWith("hi");
    }

    function applyOfflineTexts() {
      const hindi = isHindiLang();
      document.documentElement.lang = hindi ? "hi" : "en";
      document.getElementById("starOfflineMsg").textContent = hindi
        ? "कृपया आगे बढ़ने के लिए अपना इंटरनेट चालू करें।"
        : "Please turn on your internet connection to continue.";
      document.getElementById("starOfflineBtn").textContent = hindi
        ? "दोबारा कोशिश करें"
        : "Retry";
    }

    function setRetryStatus(text) {
      const el = document.getElementById("starOfflineStatus");
      if (el) el.textContent = text || "";
    }

    async function checkRealConnection() {
      const host = String(window.location.hostname || "").toLowerCase();
      const proto = String(window.location.protocol || "").toLowerCase();
      if (proto === "file:" || host === "localhost" || host === "127.0.0.1" || host === "::1") {
        return true;
      }
      if (!navigator.onLine) return false;

      const pingUrl = `${window.location.origin || ""}/?_ping=${Date.now()}`;
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 2500);

      try {
        await fetch(pingUrl, { method: "HEAD", cache: "no-store", signal: controller.signal });
        clearTimeout(timer);
        return true;
      } catch (_) {
        try {
          await fetch(pingUrl, { method: "GET", mode: "no-cors", cache: "no-store", signal: controller.signal });
          clearTimeout(timer);
          return true;
        } catch (__) {
          clearTimeout(timer);
          return false;
        }
      }
    }

    async function handleStarRetry() {
      const hindi = isHindiLang();
      const btn = document.getElementById("starOfflineBtn");
      if (btn) btn.disabled = true;

      setRetryStatus(hindi ? "इंटरनेट चेक हो रहा है..." : "Checking internet connection...");
      const connected = await checkRealConnection();

      if (connected) {
        setRetryStatus(hindi ? "इंटरनेट जुड़ गया है, ऐप खुल रहा है..." : "Connected, opening app...");
        window.location.replace("./index.html");
      } else {
        if (btn) btn.disabled = false;
        setRetryStatus(
          hindi
            ? "अभी भी इंटरनेट बंद है। कृपया इंटरनेट चालू करें।"
            : "Still offline. Please turn on your internet."
        );
      }
    }

    window.addEventListener("online", () => {
      handleStarRetry();
    });

    applyOfflineTexts();
  </script>

</body>
</html>
